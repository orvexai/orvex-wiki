---
# orvex-wiki — Multi-Environment Kustomization
#
# Built by the `kustomize-helm` CMP plugin (see my-idp-apps
# app-environments ApplicationSet). The plugin rewrites cluster-config's
# environment-specific fields (appNamespace, branchSlug, environment) from the
# env vars before this build runs, and appends the matching component:
#   main → (base only, production)   appNamespace=orvex-wiki
#   dev  → components/staging        appNamespace=orvex-wiki-dev
#
# Per-environment hostname (wikiHost / APP_URL) is owned HERE, NOT by the
# plugin: base carries the production host (wiki.orvex.ai); components/staging
# patches the HTTPRoute + ConfigMap to the dev equivalent (wiki.orvex.dev).
#
# This is a clean vanilla docmost/docmost@v0.95.0 deploy — CORE capabilities
# only (Postgres, Redis, S3 storage, APP_SECRET, image build+serve). No
# Clerk/OIDC/AI/LiteLLM/SCIM/SearXNG/Tika — those are orvex-fork-specific and
# deliberately absent here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/name: orvex-wiki
      app.kubernetes.io/part-of: orvex-wiki
      app.kubernetes.io/managed-by: argocd
    includeSelectors: false

resources:
  # Build-time only (not emitted) — drives the replacements below.
  - cluster-config.yaml

  # ── app-manifests (nested Kustomization; see app-manifests/kustomization.yaml) ──
  - app-manifests

  # ── platform-resources (Crossplane: Postgres + Redis, + self-provisioned secrets) ─
  - platform-resources/infrastructure-credentials.yaml  # waves 1-2 (password + push)
  - platform-resources/app-secret-credentials.yaml      # waves 1-2 (password + push)
  - platform-resources/postgres-claim.yaml              # wave 3
  - platform-resources/redis-claim.yaml                 # wave 3

# ═══════════════════════════════════════════════════════════════════════════
# Components — the shared image-injection component (AD-29 / ENG-3296 /
# ENG-3327).
#
# This overlay no longer says what an Orvex image is called. The container
# image in app-manifests/deployment.yaml is written as the three-token shape
# `IMAGE_REGISTRY/IMAGE_PROJECT/orvex-wiki-engine:IMAGE_TAG`, and the component
# stamps the registry host, the Harbor project and the derived
# `{branchSlug}-{shortSha}` tag — the SAME three segments
# `orvex-derive-image-ref` emits inside `orvex-shared-build`. Only
# `orvex-wiki-engine`, which is genuinely this service's AD-31 identity, stays
# a literal.
#
# MATERIALIZED IN-REPO COPY (PO-2026-07-30-1), never a cross-repo reference —
# ArgoCD's repo-server silently DROPS a remote component it cannot resolve and
# renders on without it, Healthy and wrong. The copy is held byte-identical to
# my-idp-apps' canonical `components/image-injection/` by
# `./manifest-copy-check.sh`, which is in `ci-success`'s `needs:`.
#
# That gate is a COMMITTED SCRIPT here, not the reusable workflow every private
# sibling calls, because this repo is PUBLIC and GitHub refuses a public repo
# calling a private repo's reusable workflow — the same constraint
# `substrate-lint-drift.sh` beside it already carries (ENG-3327).
#
# The CMP plugin APPENDS the resource-profile component (`components/staging`
# in dev) to this list rather than replacing it; the two are independent.
#
# ── components/telemetry-env (AD-25 / ENG-3103) ────────────────────────────
# The ONE family app-telemetry OTLP target. Same materialized shape and the
# same regen gate as image-injection above, for the same public-repo reason.
#
# This is the LIVE fix for the black hole: this engine's ~1,918 LOC of OTel
# used to export into a collector in the orvex-studio-console namespace that
# exists in no namespace at all, so every span, metric and log was silently
# discarded. (The host string itself is deliberately not re-typed here — the
# one place in this repo that still spells it is the render gate that asserts
# its ABSENCE, otlp_single_endpoint_test.go, the same way contracts' obs-gate
# keeps it in rules.yaml.) ENG-3103's first attempt (PR #135) adopted the shared
# component by CROSS-REPO reference and was reverted the same day
# (`ef16602f`) — `public-runners` hold no credential for the PRIVATE
# my-idp-apps, so `kustomize build` died on `could not read Username`. The
# workaround that followed hand-set the endpoint as a per-service literal in
# app-manifests/configmap-env.yaml, which is the exact shape AD-25 forbids
# ("MUST NOT appear in any per-service ConfigMap, Deployment or chart values
# file"). Both are now closed by materializing instead: no cross-repo read at
# render time, no private-repo credential at CI time, and no literal.
#
# The component carries BOTH halves — the `telemetry-env` ConfigMap whose one
# key IS the env var name, and the JSON6902 patch that appends
# `configMapRef: telemetry-env` to `containers[0].envFrom`. So the reference
# below is the ENTIRE integration; nothing in this repo names the variable.
# app-manifests/deployment.yaml already carries a populated `envFrom:` list
# (the precondition the component's own header states its `-` append needs).
# ═══════════════════════════════════════════════════════════════════════════
components:
  - components/image-injection
  - components/telemetry-env

# ═══════════════════════════════════════════════════════════════════════════
# Harbor project — RULING (2026-07-30, ENG-3327): the AGPL engine image moves
# to the `orvex-studio` Harbor project, i.e. the component's default is taken
# unchanged and this overlay adds NOTHING.
#
# The first draft of this change kept the engine in the `orvex-wiki` project
# and patched the component's `imageProject` key here — the mechanism the
# component's own header documents ("a service published into a different
# project patches this key in its own overlay ... it never edits this file").
#
# MEASURED: that mechanism does not work. A `patches:` entry at this level is
# applied AFTER the component's `replacements` have already stamped the image
# string, so the render still carries `orvex-studio` — silently, exit 0, no
# warning. Verified with kustomize v5.8.1 against this exact tree, including
# with the target's `namespace: image-ref` supplied (without it the target
# matches nothing at all, which a JSON6902 `replace` on a bogus path proves by
# NOT erroring). The component's documented override is a dead end, and that
# is filed against the component rather than worked around here (ENG-3337).
#
# Given the override cannot work, the choice was: change the shared component
# (new hashes, roster regen, every consumer re-materializes) or take the
# default. Taking the default, because the Harbor project is a PUBLISHING
# LOCATION, not the licence boundary. The AGPL boundary is enforced where it
# is actually checkable — the source repo, `engine-license-guard`,
# `license-header-check` and `engine-only-import-guard`, all of which run in
# this file — and none of that changes with the project a built layer sits in.
#
# The old `orvex-wiki/orvex-wiki` images are LEFT IN PLACE; nothing is deleted,
# and an older revision remains pullable by digest.
#
# `tekton/orvex-wiki-trigger.yaml` carries `harbor-project: orvex-studio` to
# match. That agreement between the two halves is precisely what ENG-3296
# measured and found broken fleet-wide, so it is asserted, not assumed:
# `image-injection-conform.sh` compares the rendered string against the string
# the derive Task emits.

# ═══════════════════════════════════════════════════════════════════════════
# Replacements — inject cluster-config values at build time.
# ═══════════════════════════════════════════════════════════════════════════
replacements:
  # ─── Namespace injection ────────────────────────────────────────────────
  - source:
      kind: ConfigMap
      name: cluster-config
      fieldPath: data.appNamespace
    targets:
      - select:
          namespace: orvex-wiki
        fieldPaths:
          - metadata.namespace
  # Namespace resource name (cluster-scoped — no metadata.namespace)
  - source:
      kind: ConfigMap
      name: cluster-config
      fieldPath: data.appNamespace
    targets:
      - select:
          kind: Namespace
          name: orvex-wiki
        fieldPaths:
          - metadata.name

  # NOTE(AD-29): the image-tag replacement that used to live here — branchSlug
  # into the tag — is DELETED, not moved. It was this repo's own opinion about
  # what an Orvex image is called, and it disagreed with the shared pipeline's
  # on the repository path AND on the tag: it rendered
  # `…/orvex-wiki/orvex-wiki:dev` while `orvex-derive-image-ref` pushes
  # `…/orvex-wiki/orvex-wiki-engine:dev-<sha>`. Keeping it alongside
  # components/image-injection would not merely be redundant — both target
  # `containers.*.image`, so the two would fight over the same field. There is
  # exactly one producer of an image reference in this fleet, and it is not
  # this file.

  # ─── Load-balancer target for external-dns (HTTPRoute) ──────────────────
  - source:
      kind: ConfigMap
      name: cluster-config
      fieldPath: data.loadBalancerIP
    targets:
      - select:
          kind: HTTPRoute
        fieldPaths:
          - metadata.annotations.[external-dns.alpha.kubernetes.io/target]

  # ─── ExternalSecret OpenBao paths: PLACEHOLDER_APP_NAME → appNamespace ────
  # Per-ENVIRONMENT path (orvex-wiki vs orvex-wiki-dev) so each env gets its
  # OWN creds. EXCLUDED (fixed shared path, must NOT be per-namespace-rewritten):
  #   - harbor-registry-credentials → harbor/admin
  - source:
      kind: ConfigMap
      name: cluster-config
      fieldPath: data.appNamespace
    targets:
      - select:
          kind: ExternalSecret
        reject:
          - name: harbor-registry-credentials
        fieldPaths:
          - spec.data.*.remoteRef.key
        options:
          delimiter: /
          index: 0

  # ─── PushSecret OpenBao destination paths: PLACEHOLDER_APP_NAME → appNamespace
  - source:
      kind: ConfigMap
      name: cluster-config
      fieldPath: data.appNamespace
    targets:
      - select:
          kind: PushSecret
        fieldPaths:
          - spec.data.*.match.remoteRef.remoteKey
        options:
          delimiter: /
          index: 0

  # PushSecret template host: PLACEHOLDER_NAMESPACE → appNamespace (postgres + redis)
  - source:
      kind: ConfigMap
      name: cluster-config
      fieldPath: data.appNamespace
    targets:
      - select:
          kind: PushSecret
          name: orvex-wiki-postgres-credentials-push
        fieldPaths:
          - spec.template.data.host
        options:
          delimiter: "."
          index: 1
      - select:
          kind: PushSecret
          name: orvex-wiki-redis-credentials-push
        fieldPaths:
          - spec.template.data.host
        options:
          delimiter: "."
          index: 1

  # ─── PostgresInstanceClaim + db-bootstrap secret name ───────────────────
  # Both render to `<appNamespace>-db-bootstrap` so the claim's bootstrap secret
  # and the ExternalSecret output stay in lockstep across environments.
  - source:
      kind: ConfigMap
      name: cluster-config
      fieldPath: data.appNamespace
    targets:
      - select:
          kind: PostgresInstanceClaim
        fieldPaths:
          - spec.credentialsSecretName
        options:
          delimiter: "-"
          index: 0
      - select:
          kind: ExternalSecret
          name: orvex-wiki-db-bootstrap
        fieldPaths:
          - spec.target.name
        options:
          delimiter: "-"
          index: 0

  # ─── S3 bucket name: PLACEHOLDER_APP_NAME-bucket → <appNamespace>-bucket ──
  - source:
      kind: ConfigMap
      name: cluster-config
      fieldPath: data.appNamespace
    targets:
      - select:
          kind: ObjectStorageClaim
          name: orvex-wiki-s3
        fieldPaths:
          - spec.bucketName
        options:
          delimiter: "-"
          index: 0

  # ─── Config: APP_URL + S3_ENDPOINT (ConfigMap) ──────────────────────────
  - source:
      kind: ConfigMap
      name: cluster-config
      fieldPath: data.wikiHost
    targets:
      - select:
          kind: ConfigMap
          name: orvex-wiki-env
        fieldPaths:
          - data.APP_URL
        options:
          delimiter: "/"
          index: 2
      # NOTE: the HTTPRoute host is NOT injected via wikiHost here — it's a
      # CELLTOKEN placeholder in the base manifest, patched to the dev domain
      # suffix by components/staging, and gets its literal token value from
      # the dedicated cellToken replacements below instead (see "Cell token"
      # section). A whole-host wikiHost injection here previously overwrote
      # the staging hostname patch (leaving prod host + dev sectionName →
      # route Accepted=False) — the token-only replacement avoids that by
      # only ever touching the single CELLTOKEN segment, on both prod (base)
      # and dev (components/staging) independently.
  - source:
      kind: ConfigMap
      name: cluster-config
      fieldPath: data.s3Endpoint
    targets:
      - select:
          kind: ConfigMap
          name: orvex-wiki-env
        fieldPaths:
          - data.AWS_S3_ENDPOINT

  # ─── Cell contract: CELL_ID + CLUSTER_NAME (ConfigMap) ──────────────────
  # A-CELL rule #4 — /healthz echoes both. Base = sentinel "solo"; a real cell
  # sets cluster-config.cellId/clusterName. Both are plain-value replacements
  # (no delimiter). components/crew leaves CELL_ID at "solo" (crew runs the
  # sentinel cell) — it isolates the SPINE via EVENT_TOPIC_SUFFIX instead.
  - source:
      kind: ConfigMap
      name: cluster-config
      fieldPath: data.cellId
    targets:
      - select:
          kind: ConfigMap
          name: orvex-wiki-env
        fieldPaths:
          - data.CELL_ID
  - source:
      kind: ConfigMap
      name: cluster-config
      fieldPath: data.clusterName
    targets:
      - select:
          kind: ConfigMap
          name: orvex-wiki-env
        fieldPaths:
          - data.CLUSTER_NAME

  # ─── Cell token (ENG-1505 fix-pass — single source) ─────────────────────
  # cluster-config.cellToken is the ONLY place the literal short cell token
  # is typed. Two hops:
  #   1. Relay it onto orvex-wiki-env's CELL_TOKEN field. cluster-config.yaml
  #      is local-config:true (pruned from the render), so without this hop
  #      the token would be unreachable once components/staging runs (a
  #      Component only sees resources already emitted by the base build).
  #   2. Substitute it into the base (prod) HTTPRoute's CELLTOKEN placeholder
  #      segments. components/staging repeats step 2 against its own
  #      dev-domain CELLTOKEN placeholders, sourcing the SAME
  #      orvex-wiki-env.CELL_TOKEN relayed here — so prod and dev both derive
  #      the token from cluster-config.cellToken alone.
  - source:
      kind: ConfigMap
      name: cluster-config
      fieldPath: data.cellToken
    targets:
      - select:
          kind: ConfigMap
          name: orvex-wiki-env
        fieldPaths:
          - data.CELL_TOKEN
      - select:
          kind: HTTPRoute
          labelSelector: "orvex-wiki.orvex.ai/resource-profile!=crew"
        fieldPaths:
          - metadata.annotations.[external-dns.alpha.kubernetes.io/hostname]
          - spec.hostnames.0
        options:
          delimiter: "."
          index: 1
      - select:
          kind: HTTPRoute
          labelSelector: "orvex-wiki.orvex.ai/resource-profile!=crew"
        fieldPaths:
          - spec.parentRefs.0.sectionName
        options:
          delimiter: "-"
          index: 1
