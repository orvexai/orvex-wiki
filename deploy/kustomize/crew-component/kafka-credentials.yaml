# Outbox relay + entitlement consumer -> platform-kafka over its SCRAM-SHA-512
# TLS listener (tls:9093; the anonymous plaintext :9092 listener was removed
# 2026-10-12). Reads the platform-owned entries published by the Strimzi
# KafkaUser `orvex-wiki-PLACEHOLDER` PushSecret and the cluster-CA PushSecret
# (my-idp platform/apps/kafka). Same shape as orvex-studio-billing's
# production kafka-credentials ExternalSecret. Uses openbao-backend (the
# platform mount) and is rejected from the appNamespace path rewrite in
# kustomization.yaml. crew-env-render picks it up through vm-env.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orvex-wiki-kafka-credentials
  namespace: orvex-wiki
  labels:
    app.kubernetes.io/component: kafka-credentials
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-backend
  target:
    name: orvex-wiki-kafka-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: KAFKA_SASL_PASSWORD
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
        key: shared/kafka/orvex-wiki-PLACEHOLDER
        property: password
    - secretKey: KAFKA_TLS_CA_PEM
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
        key: shared/kafka/cluster-ca
        property: ca.crt
