# HTTPRoute for the dedicated Yjs collaboration WebSocket host.
#
# The collab socket is deliberately on its own DNS-only hostname. Cloudflare
# proxying is incompatible with the transport's long-lived WebSocket posture
# and the host has its own Gateway listener/certificate in platform GitOps.
# The CELLTOKEN placeholder is replaced from cluster-config.cellToken by the
# root kustomization, just like the primary wiki route.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: orvex-wiki-collab
  namespace: orvex-wiki
  labels:
    app.kubernetes.io/name: orvex-wiki
  annotations:
    argocd.argoproj.io/sync-wave: "6"
    external-dns.alpha.kubernetes.io/hostname: "collab.CELLTOKEN.orvex.ai"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    external-dns.alpha.kubernetes.io/target: "37.27.73.18"
spec:
  hostnames:
    - collab.CELLTOKEN.orvex.ai
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: platform-gateway
      namespace: traefik
      sectionName: orvex-CELLTOKEN-https
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: orvex-wiki
          port: 3000
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /collab
