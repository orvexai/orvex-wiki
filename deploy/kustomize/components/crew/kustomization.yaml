---
# Crew component — a per-developer COMPLETE parallel stack (crew-design.md).
# Appended by the CMP plugin when RESOURCE_PROFILE=crew, after idp-render
# rewrites cluster-config for the crew environment (appNamespace=
# orvex-wiki-crew-{name}, gitBranch=crew/{name}, branchSlug=crew-{name} — the
# LAST of these is computed by idp-render's existing Go-level slugify, no new
# per-crew wiring needed).
#
# Crew links to crew: a crew is a full parallel copy of the platform and it
# talks ONLY to itself — every sibling URL resolves to that sibling's OWN crew
# instance (crew → crew), never shared dev. The outbox topic is explicitly
# configured to the crew's own Kafka spine as well. (The single-service slot-in —
# routing shared dev at ONE crew service — is the deliberate exception and is
# applied by orvex-scripts crew-slot.sh against the CONSUMERS' ConfigMaps, never
# here.)
#
# Host scheme: {service}.crew-{name}.orvex.dev = wiki.crew-{name}.orvex.dev.
# The host is keyed by the DOMAIN/service name `wiki` (matching the
# ORVEX_WIKI_* endpoint siblings consumers use).
#
# HOW THE PER-BRANCH VALUE GETS IN (ENG note, replaces an earlier broken
# design): a literal CREW_NAME token meant to be substituted by `idp-render
# finalize`'s raw byte-string pass CANNOT work — cluster-config.yaml carries
# `config.kubernetes.io/local-config: "true"`, so plain `kustomize build`
# excludes it from the OUTPUT stream, and finalize only ever sees that stream
# (never the on-disk cluster-config.yaml). So finalize can never recover a
# value to substitute and the token stays literal. Verified locally: a
# `kustomize build` + `idp-render finalize` run left "CREW_NAME" un-replaced
# in every field below.
#
# The fix: use Kustomize's OWN `replacements:` transformer (below), which runs
# as part of the kustomize build itself and CAN read cluster-config as an
# in-memory source even though it's excluded from final output (same
# mechanism the root kustomization.yaml already relies on for wikiHost/
# branchSlug/appNamespace). Patches below set up a templated placeholder
# segment in each field; `replacements:` then substitutes it with
# cluster-config.branchSlug (already exactly "crew-{name}", computed by
# idp-render's applyBranch — no derive step, no new idp-render code needed).
#
# ENG-3788 posture selection: crew keeps the intentional `CELL_ID=solo`
# sentinel, but explicitly runs in self-hosted mode. The component must patch
# CLOUD because the base value is true for promoted cells; otherwise ENG-3789's
# cloud-plus-solo boot assertion rejects both crew cells.
#
# Data plane (crew-design.md §Data): platform-resources (Postgres/Redis) is
# NOT excluded here — a Kustomize Component cannot delete base resources — so
# today every crew env provisions its OWN Postgres/Redis via the base
# platform-resources claims (self-contained, works standalone). The originally
# intended "share dev's Postgres/Redis by default" optimization is a follow-up,
# not required to bring a crew env up.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

labels:
  - pairs:
      orvex-wiki.orvex.ai/resource-profile: crew  # cell-lint-allow: label namespace key, not a URL
    includeSelectors: false

patches:
  # ── ENG-3788: crew is self-hosted, not a promoted cloud cell ─────────────
  # This component is applied independently to every crew branch, so the same
  # explicit posture reaches crew/daniel and crew/yafet. The decision record is
  # pending human ratification; the ENG-3788 CI gate keeps it from deployment
  # until the owner confirms it.
  - patch: |-
      - op: replace
        path: /data/CLOUD
        value: "false"
    target:
      kind: ConfigMap
      name: orvex-wiki-env

  # ── ENG-3071 Phase-B / ENG-3063: this crew's FA chain-shell authn ref →
  # orvex-edge-authn-crew-{name} (base points at -prod; same base→component-
  # patch technique this file already uses below for every other crew-scoped
  # value). Index 2 = the authn chain member (0=sanitize, 1=target-wiki,
  # 2=authn) — see ../../app-manifests/middleware-wiki-edge-forwardauth.yaml.
  # The PLACEHOLDER segment below is a clean, unambiguous dash-delimited
  # token (the field's ONLY other content is the fixed "orvex-edge-authn"
  # prefix, no embedded dashes/dots to collide with) — the `replacements`
  # block at the end of this file substitutes it with cluster-config.
  # branchSlug (already exactly "crew-{name}"), same mechanism as every other
  # per-crew value here. Resolves today to orvex-edge-authn-crew-daniel or
  # orvex-edge-authn-crew-yafet — the two crew identities my-idp's
  # middleware-edge.yaml actually defines (confirmed live via `kubectl -n
  # traefik get middleware`); a hypothetical third crew name would need its
  # own orvex-edge-authn-crew-<name> added there first (a pre-existing
  # platform-wide constraint, not something this change introduces).
  - patch: |-
      - op: replace
        path: /spec/chain/middlewares/2/name
        value: orvex-edge-authn-PLACEHOLDER
    target:
      kind: Middleware
      name: orvex-edge-forwardauth-wiki

  # ── Crew edge-assertion config: NOT overridden here (disclosed limit) ────
  # ORVEX_EDGE_JWKS_URL is left at base's PROD value in this component
  # (unlike the dev override in components/staging). EdgeAuthModule.
  # register() is never called anywhere in app.module.ts today (ENG-3063
  # left it deliberately inert — see configmap-env.yaml's own comment), so
  # this key is inert/unconsumed on every cell including crew; getting the
  # per-crew cluster-DNS namespace segment (orvex-studio-identity-crew-
  # {name}) through this file's own delimiter-substitution mechanism would
  # require splitting a value that ALSO contains the literal
  # "orvex-studio-identity" substring twice (once as the Service name, once
  # as the namespace prefix) — a genuine index-ambiguity risk not worth
  # taking for a currently-inert key. Revisit when a real per-request
  # consumer is wired (a follow-up ticket, not this one).

  # ── Crew host on the HTTPRoute: → wiki.crew-{name}.orvex.dev ─────────────
  # Re-pin the Gateway listener to orvex-dev-https (the crew host only
  # intersects the *.orvex.dev listener/cert, same edge as dev). The
  # "PLACEHOLDER" segment is overwritten by the replacements block below.
  - patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: wiki.PLACEHOLDER.orvex.dev  # cell-lint-allow: own public host (HTTPRoute/APP_URL), not a peer
      - op: replace
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1hostname
        value: wiki.PLACEHOLDER.orvex.dev  # cell-lint-allow: own public host (HTTPRoute/APP_URL), not a peer
      - op: replace
        path: /spec/parentRefs/0/sectionName
        value: orvex-dev-https
    target:
      kind: HTTPRoute
      name: orvex-wiki

  # ── Crew APP_URL → https://wiki.crew-{name}.orvex.dev ────────────────────
  # APP_URL is a REPLACEMENT target (root kustomization sources its host from
  # cluster-config.wikiHost, delimiter "/" index 2). A component patch on the
  # ConfigMap APP_URL value is therefore OVERWRITTEN by that replacement (the
  # staging overlay hits this exact quirk). So we patch the replacement's
  # SOURCE — cluster-config.wikiHost — and the crew host propagates into
  # APP_URL correctly.
  - patch: |-
      - op: replace
        path: /data/wikiHost
        value: wiki.PLACEHOLDER.orvex.dev  # cell-lint-allow: own public host (HTTPRoute/APP_URL), not a peer
    target:
      kind: ConfigMap
      name: cluster-config

  # ── Siblings → this crew's own instances (crew → crew) + spine isolation ─
  # ORVEX_<SVC>_URL, EVENT_TOPIC_SUFFIX, and KAFKA_OUTBOX_TOPIC are not root
  # replacement targets, so these patches survive the build. Every sibling
  # resolves to its crew host, and the explicitly configured outbox topic below
  # is `wiki-events.crew-{name}` — distinct from CELL_ID, which stays "solo"
  # under the CLOUD=false posture. The engine runs no Temporal worker, so there
  # is no TEMPORAL_NAMESPACE to isolate here.
  - patch: |-
      - op: replace
        path: /data/EVENT_TOPIC_SUFFIX
        value: PLACEHOLDER
      - op: replace
        path: /data/KAFKA_OUTBOX_TOPIC
        value: wiki-events.PLACEHOLDER
      - op: replace
        path: /data/ORVEX_IDENTITY_URL
        value: https://identity.PLACEHOLDER.orvex.dev  # cell-lint-allow: operator ruling 2026-07-06 (3b): crew-to-crew siblings ride the public ingress until the crew svc-DNS convention is pinned; publicly-needed URLs only
      - op: replace
        path: /data/ORVEX_KNOWLEDGE_URL
        value: https://knowledge.PLACEHOLDER.orvex.dev  # cell-lint-allow: operator ruling 2026-07-06 (3b): crew-to-crew siblings ride the public ingress until the crew svc-DNS convention is pinned; publicly-needed URLs only
      - op: replace
        path: /data/ORVEX_AI_URL
        value: https://ai.PLACEHOLDER.orvex.dev  # cell-lint-allow: operator ruling 2026-07-06 (3b): crew-to-crew siblings ride the public ingress until the crew svc-DNS convention is pinned; publicly-needed URLs only
      - op: replace
        path: /data/ORVEX_BILLING_API_URL
        value: https://billing.PLACEHOLDER.orvex.dev  # cell-lint-allow: operator ruling 2026-07-06 (3b): crew-to-crew siblings ride the public ingress until the crew svc-DNS convention is pinned; publicly-needed URLs only
      - op: replace
        path: /data/ORVEX_MCP_URL
        value: https://mcp.PLACEHOLDER.orvex.dev  # cell-lint-allow: operator ruling 2026-07-06 (3b): crew-to-crew siblings ride the public ingress until the crew svc-DNS convention is pinned; publicly-needed URLs only
      - op: replace
        path: /data/ORVEX_CONSOLE_URL
        value: https://console.PLACEHOLDER.orvex.dev  # cell-lint-allow: operator ruling 2026-07-06 (3b): crew-to-crew siblings ride the public ingress until the crew svc-DNS convention is pinned; publicly-needed URLs only
      - op: replace
        path: /data/ORVEX_WIKI_API_URL
        value: https://wiki-api.PLACEHOLDER.orvex.dev  # cell-lint-allow: operator ruling 2026-07-06 (3b): crew-to-crew siblings ride the public ingress until the crew svc-DNS convention is pinned; publicly-needed URLs only
    target:
      kind: ConfigMap
      name: orvex-wiki-env

  # ── Single replica (matches the single-node dev shape) ──────────────────
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: orvex-wiki

  # ── Neutralize the PDB: a 1-replica pod must stay freely disruptable ────
  - patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 0
    target:
      kind: PodDisruptionBudget
      name: orvex-wiki

# ─────────────────────────────────────────────────────────────────────────
# Replacements — inject the real "crew-{name}" value (cluster-config.
# branchSlug) into every PLACEHOLDER segment patched in above. Runs as part
# of the kustomize build (unlike finalize's raw string pass), so it can read
# cluster-config even though that resource is excluded from final output.
# ─────────────────────────────────────────────────────────────────────────
replacements:
  - source:
      kind: ConfigMap
      name: cluster-config
      fieldPath: data.branchSlug
    targets:
      - select:
          kind: HTTPRoute
          name: orvex-wiki
        fieldPaths:
          - spec.hostnames.0
          - metadata.annotations.[external-dns.alpha.kubernetes.io/hostname]
        options:
          delimiter: "."
          index: 1
      - select:
          kind: ConfigMap
          name: cluster-config
        fieldPaths:
          - data.wikiHost
        options:
          delimiter: "."
          index: 1
      - select:
          kind: ConfigMap
          name: orvex-wiki-env
        fieldPaths:
          - data.EVENT_TOPIC_SUFFIX
      - select:
          kind: ConfigMap
          name: orvex-wiki-env
        fieldPaths:
          - data.KAFKA_OUTBOX_TOPIC
        options:
          delimiter: "."
          index: 1
      - select:
          kind: ConfigMap
          name: orvex-wiki-env
        fieldPaths:
          - data.ORVEX_IDENTITY_URL
          - data.ORVEX_KNOWLEDGE_URL
          - data.ORVEX_AI_URL
          - data.ORVEX_BILLING_API_URL
          - data.ORVEX_MCP_URL
          - data.ORVEX_CONSOLE_URL
          - data.ORVEX_WIKI_API_URL
        options:
          delimiter: "."
          index: 1
      # ── ENG-3071 Phase-B / ENG-3063 crew authn substitution ──────────────
      # "orvex-edge-authn-PLACEHOLDER" split by "-" -> ["orvex","edge",
      # "authn","PLACEHOLDER"], index 3 replaced with branchSlug
      # ("crew-daniel"/"crew-yafet") and rejoined by "-" ->
      # "orvex-edge-authn-crew-daniel". Clean: unlike the ORVEX_*_URL fields
      # above, this field's ONLY content is the fixed "orvex-edge-authn"
      # prefix + the placeholder, so there is no other "-"-delimited
      # substring to collide with.
      - select:
          kind: Middleware
          name: orvex-edge-forwardauth-wiki
        fieldPaths:
          - spec.chain.middlewares.2.name
        options:
          delimiter: "-"
          index: 3
