apiVersion: v1
kind: ConfigMap
metadata:
  name: orvex-wiki-vm-env
  namespace: orvex-wiki
  labels:
    app.kubernetes.io/part-of: orvex-wiki
data:
  # Copied from the rendered orvex-wiki Deployment container's envFrom
  # (telemetry-env is appended there by components/telemetry-env). The crew-vm
  # guest renderer (crew-env-render) resolves these references. It carries
  # envFrom ONLY: the Deployment's env[] entries (AWS_S3_ACCESS_KEY_ID,
  # AWS_S3_SECRET_ACCESS_KEY, AWS_S3_BUCKET from orvex-wiki-s3-bucket) are NOT
  # carried to the VM.
  envFrom: '[{"configMapRef":{"name":"orvex-wiki-env"}},{"secretRef":{"name":"orvex-wiki-db-credentials","optional":true}},{"secretRef":{"name":"orvex-wiki-redis-credentials","optional":true}},{"secretRef":{"name":"orvex-wiki-app-secret","optional":true}},{"secretRef":{"name":"orvex-wiki-internal-api","optional":true}},{"configMapRef":{"name":"telemetry-env"}}]'
