reason = "ENG-3698. image-size: JXL/HEIF parser DoS (infinite loop). Case 2 (proven unreachable, no upstream fix): OSV's own affected range for this advisory is introduced:0 -> last_affected:2.0.2 — 2.0.2 is image-size's CURRENT latest published version (`npm view image-size dist-tags.latest` = 2.0.2), so no upgrade exists that clears it; case-1 (upgrade) and the task's case-(b) (safe major bump) are both categorically unavailable. image-size@0.5.5 is pulled in ONLY via `less@4.2.0`, which is ONLY ever reached as vite's OPTIONAL peer dependency (`peerDependenciesMeta.less.optional === true` in vite's own package.json) — vite dynamically `require()`s it from exactly one place, its CSS-preprocessor dispatcher (`loadPreprocessorPath('less', root)`, apps/client's resolved vite/dist/node/chunks/node.js), which is called only when vite's build pipeline encounters a `.less`-extension import. `find . -iname '*.less' -not -path '*/node_modules/*'` across the ENTIRE repo returns ZERO files, and a repo-wide grep for `from 'less'`/`require('less')`/any `.less`-extension reference in source, config, or vite.config.* also returns zero hits — the gating condition (a `.less` import existing anywhere) is provably never satisfied, so this dynamic require, and therefore `less`'s own image-size()-calling code, never executes. less+vite are devDependencies only (never in the production client/server bundle) — belt-and-braces on top of the reachability proof. Exit: image-size ships a fix past 2.0.2 and this repo takes it, OR the repo starts using .less files (re-prove or delete immediately, not carried on inertia)."

