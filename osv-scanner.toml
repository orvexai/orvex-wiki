# osv-scanner exception ledger — the ONLY sanctioned way an advisory may fail to
# red `Security (audit + govulncheck)`, and it is neither silent nor permanent.
#
# This is osv-scanner's own documented per-advisory ignore format
# (https://google.github.io/osv-scanner/configuration/), so the scanner honours
# it directly for anyone running `osv-scanner scan --lockfile=pnpm-lock.yaml`
# here, AND scripts/ci/audit-osv.sh reads this same file to print + VALIDATE
# every entry. That gate does not trust the file: it fails the build if an entry
# lacks a reason or an `ignoreUntil`, if `ignoreUntil` has passed, if the window
# is longer than 120 days, if the reason names no ENG ticket, or if an excepted
# advisory is no longer reported at all (a stale exception must be deleted, not
# parked). Every finding — excepted or not — is printed in the CI log.
#
# WHEN AN ENTRY IS LEGITIMATE — exactly two cases, and both are proven, not
# argued:
#
#   1. DATA DEFECT, not a vulnerability we are choosing to carry: upstream
#      published the fix as a BACKPORT onto an older release line, this repo
#      resolves that patched backport, but the GitHub advisory range was
#      never SPLIT to exclude it, so OSV still matches the version. The
#      vulnerable code is not present in the resolved tree; the advisory
#      range is stale. Proven by unpacking the resolved tarball.
#
#   2. PROVEN UNREACHABLE, upgrade impossible: no patched version exists
#      upstream for ANY resolved candidate (ruling out fix-by-upgrade), AND a
#      concrete call-path trace shows the vulnerable function can never
#      execute in this repo — e.g. a dev-only build-tool code path gated on
#      an input (a file extension, a config flag) that provably never occurs
#      here. "We think it's probably not hit" is NOT this case — the trace
#      must be as concrete as case 1's tarball unpack: name the exact gating
#      condition and show, by direct inspection (a repo-wide grep, reading
#      the gating source), that it is never satisfied. A hand-wave ("the
#      upgrade is inconvenient", "the path is *probably* not reachable", "we
#      will do it next sprint") is still a red — fix the dependency instead.
#
# EXIT CONDITION for every entry: for case 1, the advisory-database range
# gets split (report it: https://github.com/github/advisory-database/issues)
# or the resolved version leaves the range; for case 2, upstream ships an
# actual fix and this repo takes it, OR the gating condition changes (e.g.
# the repo starts using the previously-absent feature) and the entry must be
# re-proven or deleted immediately, not carried on inertia. Then delete the
# entry — the gate will fail while a stale entry remains, so deletion is not
# optional.
#
# Tracking ticket for the case-1 entries: ENG-3274. ENG-3698 was a case-2
# entry (see the removal breadcrumb below) that turned out to have a better
# fix than an exception; the ledger currently holds zero entries.
#
# GHSA-mh99-v99m-4gvg (brace-expansion DoS) removed 2026-08-02, unrelated to
# ENG-3357: osv-scanner stopped reporting it entirely (its CI log prints
# "the advisory is no longer reported by the scanner — this exception is
# STALE and must be DELETED"), meaning the advisory-database range was split
# or the resolved dependency left it — the exit condition this file's own
# header names. Deleted per that same header: "deletion is not optional."
#
# GHSA-qwww-vcr4-c8h2 (react-router RSC-mode CSRF bypass, ENG-3274) removed
# 2026-08-09 (ENG-3698): osv-scanner stopped reporting it entirely — the gate
# itself flagged it STALE ("the advisory is no longer reported by the
# scanner — this exception is STALE and must be DELETED") on the current
# resolved tree, with react-router-dom still pinned at 7.18.2 (unchanged by
# this session — `grep '"react-router-dom"' apps/client/package.json` and
# `pnpm why -r react-router` both confirm). Deleted per the header's own
# rule: "deletion is not optional."
#
# GHSA-5p2g-fcmc-qvqq / GHSA-w3rx-r6r6-pgpr (image-size JXL/HEIF + ICNS parser
# DoS, ENG-3698) carried here briefly on 2026-08-09 as case-2 entries, then
# REMOVED the same day (PR #172 review, MF-1) once independently re-verified
# and disproven as necessary: image-size@0.5.5 is an OPTIONAL transitive
# dependency (vite's optional `less` peer's own optional dependency), and
# pnpm-workspace.yaml's `ignoredOptionalDependencies: [image-size]` keeps it
# out of the resolved tree entirely — a proven zero-collateral change (the
# regenerated lockfile differs from the prior one only in the image-size
# entries). A removed vulnerability outranks a proven exception: this repo now
# carries ZERO image-size resolutions, so there is nothing left to except.
# Should image-size ever re-enter the tree through a non-optional path, redo
# the case-2 proof from scratch — do not simply restore these entries verbatim
# on the assumption the reachability analysis still holds.
